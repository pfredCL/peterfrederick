<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RBC Tri-Wrathlon timer</title>
<link rel="preload" href="fonts/overpass-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script defer src="js/config.js"></script>
<script defer src="js/model.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/start.js"></script>
</head>
<body>
<div class="phone">
  <header class="topbar"><picture><source srcset="img/crest-white.png" media="(prefers-color-scheme: dark)"><img class="crest" src="img/crest-blue.png" alt="" width="264" height="192"></picture><h1 id="race-name">RBC Tri-Wrathlon</h1></header>
  <main class="content">
    <form id="start" method="post" novalidate>
      <fieldset class="stations" id="stations">
        <legend class="page-title">Which station are you at?</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="station" value="erg"><span class="radio"></span><span class="choice-text"><span class="choice-name">Erg</span></span></label>
          <label class="choice"><input type="radio" name="station" value="entrance"><span class="radio"></span><span class="choice-text"><span class="choice-name">Stadium entrance</span></span></label>
          <label class="choice"><input type="radio" name="station" value="exit"><span class="radio"></span><span class="choice-text"><span class="choice-name">Stadium exit</span></span></label>
        </div>
      </fieldset>
      <div class="field">
        <label for="pin">PIN</label>
        <input class="text-input" id="pin" type="password" inputmode="numeric" autocomplete="off" aria-describedby="pin-error">
        <div id="pin-error-box" role="alert"><p class="row-error" id="pin-error" hidden></p></div>
      </div>
      <div class="after-form"><button class="button primary block" type="submit" id="open"><span>Open station</span></button></div>
    </form>
    <p class="footer-links" id="links">Organising? Open the <a href="organiser.html">organiser page</a> or the <a href="results.html">results</a>.</p>
  </main>
</div>
</body>
</html>
