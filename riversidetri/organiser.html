<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Organiser – RBC Tri-Wrathlon timer</title>
<link rel="icon" href="img/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/overpass-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script defer src="js/config.js"></script>
<script defer src="js/model.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/time-entry.js"></script>
<script defer src="js/organiser.js"></script>
</head>
<body>
<div class="desk">
  <header class="desk-head">
    <picture><source srcset="img/crest-white.png" media="(prefers-color-scheme: dark)"><img class="crest" src="img/crest-blue.png" alt="" width="264" height="192"></picture>
    <div><h1 id="race-name">RBC Tri-Wrathlon</h1></div>
    <div class="meta"><span id="sync" class="sync" role="status"></span><nav class="nav" aria-label="Pages"><a href="organiser.html" aria-current="page">Organiser</a><a href="results.html">Results</a></nav></div>
  </header>
  <div id="notices"></div>
  <main>
    <div class="block-head"><h2>Flights</h2></div>
    <div class="flights" id="flights"></div>
    <div class="block-head"><h2>Needs attention</h2></div>
    <div id="issues"></div>
    <div class="block-head"><h2>Everyone</h2></div>
    <div class="table-scroll">
      <table class="data">
        <caption class="visually-hidden">Everyone</caption>
        <thead><tr><th class="l" scope="col"><abbr title="Number">#</abbr></th><th class="l" scope="col">Name</th><th class="l" scope="col">Flight</th><th class="l" scope="col">Status</th><th scope="col">Erg</th><th scope="col">Run</th><th scope="col">Stadium</th><th scope="col">Total</th></tr></thead>
        <tbody id="everyone"></tbody>
      </table>
    </div>
    <p class="footnote">* denotes non-traditional tri (not eligible for awards)</p>
  </main>
  <div id="live" class="visually-hidden" aria-live="polite"></div>
</div>
</body>
</html>
