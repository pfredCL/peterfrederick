<!DOCTYPE html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Erg – RBC Tri-Wrathlon timer</title>

<link rel="stylesheet" href="/riversidetri/css/tokens.css">
<link rel="stylesheet" href="/riversidetri/css/app.css">






<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;600&amp;family=Barlow+Semi+Condensed:wght@400;600&amp;family=Big+Shoulders+Text:wght@400;600&amp;family=B612+Mono&amp;family=Saira+Semi+Condensed:wght@400;600&amp;display=swap"><link rel="stylesheet" href="review.css"></head>
<body>
<div class="phone">
  <header class="topbar"><img class="rv-crest rv-crest-blue" src="crest-blue.png" alt=""><img class="rv-crest rv-crest-white" src="crest-white.png" alt=""><h1>Erg</h1><span id="sync" class="sync" role="status"><svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>All saved</span></span></header>
  <div id="notices"></div>
  <main class="content">
    <section class="section" aria-labelledby="waiting-title">
      <div class="section-head"><h2 id="waiting-title">Waiting for a time</h2><span class="count" id="waiting-count">4</span></div>
      <div class="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="search" type="search" placeholder="Name or number" aria-label="Find a rower" autocomplete="off" value="">
      </div>
      <div id="waiting"><p class="group-label">8:10 flight</p><ul class="list"><li><button type="button" class="row" data-open="demo-24"><span class="bib">924</span><span class="main"><span class="name">Dakota Moreno</span></span><span class="aside-col"></span></button></li><li><button type="button" class="row" data-open="demo-23"><span class="bib">923</span><span class="main"><span class="name">Drew Kowalski</span></span><span class="aside-col"></span></button></li><li><div class="row is-open"><span class="bib">921</span><span class="main"><span class="name">Sasha Petrov</span></span><button type="button" class="link-button" data-close="" aria-label="Cancel the time for Sasha Petrov">Cancel</button><div class="row-entry"><div class="time-entry"><input class="time-input" id="erg-input" inputmode="numeric" autocomplete="off" spellcheck="false" autocapitalize="off" enterkeyhint="done" aria-label="Erg time for Sasha Petrov" value="47:12" aria-describedby="open-msg"><div class="time-display" aria-hidden="true"><span>4</span><span>7</span><span>:</span><span>1</span><span>2</span><span>.</span><span class="caret"></span><span class="ghost">0</span></div></div><button type="button" class="button primary" data-save=""><span>Save</span></button></div><p class="row-hint" id="open-msg">Type the digits only. The colon and decimal point fill in for you.</p></div></li><li><button type="button" class="row" data-open="demo-22"><span class="bib">922</span><span class="main"><span class="name">Taylor Quint</span></span><span class="aside-col"></span></button></li></ul></div>
    </section>
    <section class="section" aria-labelledby="entered-title">
      <div class="section-head"><h2 id="entered-title">Entered</h2><span class="count" id="entered-count">20</span></div>
      <div id="entered"><ul class="list"><li><button type="button" class="row" data-fix="demo-20"><span class="bib">920</span><span class="main"><span class="name">Reese Moreau</span></span><span class="aside-col"><span class="time">40:05.3</span></span></button></li><li><button type="button" class="row" data-fix="demo-19"><span class="bib">919</span><span class="main"><span class="name">Parker Iverson</span></span><span class="aside-col"><span class="time">37:16.9</span></span></button></li><li><button type="button" class="row" data-fix="demo-18"><span class="bib">918</span><span class="main"><span class="name">Noel Brennan</span></span><span class="aside-col"><span class="time">35:22.4</span></span></button></li></ul><button type="button" class="link-button" data-more="">Show all 20</button></div>
    </section>
    <p class="status-line" id="erg-status">All 13 times from the 7:15 flight are in.</p>
    <p class="footer-links"><a href="#">Change station</a></p>
  </main>
  <div id="live" class="visually-hidden" aria-live="polite"></div>
</div>


</body></html>
