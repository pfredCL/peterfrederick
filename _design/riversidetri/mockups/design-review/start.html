<!DOCTYPE html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RBC Tri-Wrathlon timer</title>

<link rel="stylesheet" href="/riversidetri/css/tokens.css">
<link rel="stylesheet" href="/riversidetri/css/app.css">





<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;600&amp;family=Barlow+Semi+Condensed:wght@400;600&amp;family=Big+Shoulders+Text:wght@400;600&amp;family=B612+Mono&amp;family=Saira+Semi+Condensed:wght@400;600&amp;display=swap"><link rel="stylesheet" href="review.css"></head>
<body>
<div class="phone">
  <header class="topbar"><img class="rv-crest rv-crest-blue" src="crest-blue.png" alt=""><img class="rv-crest rv-crest-white" src="crest-white.png" alt=""><h1 id="race-name">RBC Tri-Wrathlon 2026</h1></header>
  <main class="content">
    <form id="start" method="post" novalidate="">
      <fieldset class="stations" id="stations">
        <legend class="page-title">Which station are you at?</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="station" value="erg"><span class="radio"></span><span class="choice-text"><span class="choice-name">Erg</span><span class="choice-sub rv-help">In the boathouse. Type each rower's time from the monitor.</span></span></label>
          <label class="choice"><input type="radio" name="station" value="entrance" checked=""><span class="radio"></span><span class="choice-text"><span class="choice-name">Stadium entrance</span><span class="choice-sub rv-help">Where the run ends. Tap as each runner comes in.</span></span></label>
          <label class="choice"><input type="radio" name="station" value="exit"><span class="radio"></span><span class="choice-text"><span class="choice-name">Stadium exit</span><span class="choice-sub rv-help">The finish. Tap as each runner comes out.</span></span></label>
        </div>
      </fieldset>
      <div class="field">
        <label for="pin">PIN</label>
        <input class="text-input" id="pin" type="password" inputmode="numeric" autocomplete="off" aria-describedby="pin-hint pin-error" value="">
        <span class="hint rv-help" id="pin-hint">Ask the race organiser for it. You only need it once on this phone.</span>
        <div id="pin-error-box" role="alert"><p class="row-error" id="pin-error" hidden=""></p></div>
      </div>
      <div class="after-form"><button class="button primary block" type="submit" id="open"><span>Open stadium entrance</span></button></div>
    </form>
    <p class="footer-links" id="links">Organising? Open the <a href="#">organiser page</a> or the <a href="#">results</a>.</p>
  </main>
</div>


</body></html>
